<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Smart City Complaint Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="ti ti-building-community"></i></div>
      <h1>Welcome back</h1>
      <p>Smart City Complaint Assistant — Citizen Portal</p>
    </div>
    <div class="card">
      {% if error %}
      <div class="form-error mb-16"><i class="ti ti-alert-circle"></i> {{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="you@example.com"
                 value="{{ request.form.get('email','') }}" required autofocus />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
          <i class="ti ti-login"></i> Sign In
        </button>
      </form>
    </div>
    <div class="auth-footer">
      New here? <a href="{{ url_for('signup') }}">Create a citizen account</a>
      &nbsp;·&nbsp; <a href="{{ url_for('index') }}">Back to home</a>
    </div>
  </div>
</div>
</body>
</html>
