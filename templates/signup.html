<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Smart City Complaint Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="ti ti-building-community"></i></div>
      <h1>Create your account</h1>
      <p>Smart City Complaint Assistant — Citizen Portal</p>
    </div>
    <div class="card">
      {% if error %}
      <div class="form-error mb-16"><i class="ti ti-alert-circle"></i> {{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-input" placeholder="e.g. Rahul Sharma"
                 value="{{ request.form.get('name','') }}" required autofocus />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="you@example.com"
                 value="{{ request.form.get('email','') }}" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password <span style="font-size:11px;color:var(--text-muted);">(min 6 characters)</span></label>
          <input type="password" name="password" class="form-input" placeholder="Create a password" required />
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm" class="form-input" placeholder="Repeat your password" required />
        </div>
        <div style="background:var(--teal-light);border:1px solid var(--teal-mid);border-radius:var(--radius-md);padding:10px 14px;font-size:12px;color:var(--teal-deeper);margin-bottom:16px;">
          <i class="ti ti-shield-check"></i> As a citizen you can report complaints, track status, and view your full history.
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
          <i class="ti ti-user-plus"></i> Create Citizen Account
        </button>
      </form>
    </div>
    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('signin') }}">Sign in here</a>
      &nbsp;·&nbsp; <a href="{{ url_for('index') }}">Back to home</a>
    </div>
  </div>
</div>
</body>
</html>
