{% extends "base.html" %}
{% block title %}Login — Smart City Complaint Assistant{% endblock %}
{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:40px 24px;">
  <div style="width:100%; max-width:420px;">

    <div style="text-align:center; margin-bottom:28px;">
      <div style="width:52px; height:52px; border-radius:14px; background:var(--teal); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:24px; color:white;">
        <i class="ti ti-building-community"></i>
      </div>
      <h1 style="font-size:22px; font-weight:700; color:var(--text-primary);">Welcome back</h1>
      <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">Sign in to report and track city issues</p>
    </div>

    <div class="card">
      {% if error %}
      <div class="form-error mb-16"><i class="ti ti-alert-circle"></i> {{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="you@email.com"
                 value="{{ request.form.get('email','') }}" required autofocus />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">
          <i class="ti ti-login"></i> Sign In
        </button>
      </form>

      <div style="text-align:center; margin-top:16px; font-size:13px; color:var(--text-muted);">
        Don't have an account?
        <a href="{{ url_for('signup') }}" style="color:var(--teal); font-weight:500;">Sign up free</a>
      </div>
    </div>

    <div style="text-align:center; margin-top:16px; font-size:12px; color:var(--text-muted);">
      Municipal officer?
      <a href="{{ url_for('admin_login') }}" style="color:var(--text-muted); text-decoration:underline;">Admin login</a>
    </div>

  </div>
</div>
{% endblock %}
